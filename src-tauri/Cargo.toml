[package]
name = "skeletor"
version = "0.1.0"
description = "Skeletor, a bone animation editor for Phaser"
authors = ["SpacePanda"]
edition = "2021"

[lib]
name = "skeletor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
